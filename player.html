<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>RPG Map Display — Vue Joueurs</title>
  <script type="importmap">
  {
    "imports": {
      "firebase/app": "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js",
      "firebase/auth": "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js",
      "firebase/database": "https://www.gstatic.com/firebasejs/12.16.0/firebase-database.js",
      "firebase/firestore": "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js"
    }
  }
  </script>
  <link rel="stylesheet" href="./css/player.css">
</head>
<body>
  <div id="player-app">
    <canvas id="board"></canvas>
    <!-- Sélecteur d'étage joueurs (UX-12). Masqué tant qu'un seul étage est connu. -->
    <div id="player-level-tabs"></div>
  </div>
  <!-- Script classique, donc exécuté AVANT les modules différés : c'est la condition pour
       que window.RPG_FIREBASE_CONFIG existe quand resolveFirebaseConfig le cherche. -->
  <script src="./firebase-config.js"></script>
  <script type="module" src="./js/app/player.js"></script>
</body>
</html>
