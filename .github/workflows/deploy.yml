name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  # Les pull requests exécutent la vérification sans jamais déployer.
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # Porte de vérification. Rien ne part en production sans elle.
  #
  # Elle existe parce qu'un lot a été déclaré « terminé » alors que le typecheck
  # sortait 10 erreurs et que 4 tests e2e étaient rouges, avec un déploiement
  # automatique et sans filet. Cf. docs/CONVENTIONS.md §9.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      # Même version majeure que le poste de développement, pour que « vert en
      # local » et « vert en CI » signifient la même chose.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Playwright pilote un vrai Chromium : il faut le navigateur et ses
      # dépendances système.
      - run: pnpm exec playwright install --with-deps chromium

      # typecheck → unit → e2e, du moins coûteux au plus coûteux.
      #
      # RPG_FIREBASE_CONFIG active les deux scénarios Firebase réels de
      # tests/firebaseTransport.spec.mjs, seuls tests du dépôt qui ne tournaient jamais.
      # Ils exigent 7 champs : les 5 publics plus testEmail/testPassword d'un compte
      # technique. Le secret absent, les deux tests se sautent d'eux-mêmes au lieu
      # d'échouer — un fork sans secret reste donc vert.
      #
      # Ces tests écrivent dans le vrai projet Firebase : décision assumée du mainteneur
      # de ne pas séparer un projet de test, séances et CI partageant la même base.
      - run: pnpm run verify
        env:
          RPG_FIREBASE_CONFIG: ${{ secrets.RPG_FIREBASE_CONFIG }}

      # Traces des tests navigateur en échec, pour diagnostiquer sans rejouer
      # la séance à l'aveugle.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  # Job de diagnostic autonome pour observer le glisser réel des gabarits.
  # Aucun lien avec deploy (ne bloque pas et ne retarde pas les déploiements).
  geste-diagnostic:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install --with-deps chromium

      # ⚠ `pnpm exec playwright test` et non `pnpm run test:manuel -- …`. Mesuré sur pnpm 11 :
      # `pnpm run test:manuel -- --grep "fog" --list` perd **silencieusement** ses arguments et
      # lance les trois tests. Le job serait resté vert, l'artefact présent, et le
      # discriminateur ci-dessous n'aurait rien discriminé — chaque étape exécutant les trois
      # scénarios et écrasant le journal de la précédente faute de `--output`.

      # Sans `continue-on-error` : une sélection fausse doit casser le job, pas se déguiser en
      # échec de scénario. Un motif qui ne correspond à rien sort en 1 ; un motif qui en
      # correspond à deux sortirait en 0, d'où le contrôle du compte.
      - name: Contrôle de la sélection des motifs grep
        run: |
          for motif in fog murs gabarits; do
            total="$(pnpm exec playwright test --project=manuel --grep "$motif" --list | grep -E '^Total: ')"
            echo "$motif -> $total"
            if [ "$total" != "Total: 1 test in 1 file" ]; then
              echo "ERREUR : le motif '$motif' ne sélectionne pas exactement un test."
              exit 1
            fi
          done

      - name: geste — pinceau de fog
        run: pnpm exec playwright test --project=manuel --grep "fog" --output=test-results/geste-fog
        continue-on-error: true

      - name: geste — éditeur de murs
        run: pnpm exec playwright test --project=manuel --grep "murs" --output=test-results/geste-murs
        continue-on-error: true

      - name: geste — gabarits seul
        run: pnpm exec playwright test --project=manuel --grep "gabarits" --output=test-results/geste-gabarits
        continue-on-error: true

      - name: geste — les trois en série
        run: pnpm exec playwright test --project=manuel --output=test-results/geste-serie
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: geste-journal
          path: test-results/
          retention-days: 7

  deploy:
    # LA garde : pas de déploiement si la vérification échoue.
    needs: verify
    # Les pull requests sont vérifiées mais jamais publiées.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # fetch-depth: 0 est requis : le numéro de build est dérivé du nombre de commits,
      # que le clone superficiel par défaut tronquerait à 1.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Estampille la version dans l'artefact déployé, sans rien commiter.
      #
      # Cette étape existe parce que `pnpm stamp` était un geste manuel : il a été oublié
      # pendant plusieurs déploiements, laissant `js/core/version.js` sur un build et un
      # commit périmés. Or la détection de désynchronisation (T-24b) compare les numéros
      # de build entre clients : un numéro figé la neutralise en silence, et une tablette
      # gardant l'ancienne page en cache n'était plus signalée.
      #
      # Le compte de commits est monotone par construction et ne demande aucun compteur
      # commité, donc aucun push de retour et aucune boucle de workflow.
      - name: Estamper la version
        run: |
          RPG_BUILD="$(git rev-list --count HEAD)" node scripts/stamp-version.mjs
          cat js/core/version.js

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
