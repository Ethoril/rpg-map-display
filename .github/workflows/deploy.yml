name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # La disponibilité des CDN et les nouvelles versions sont observées sans rendre
  # un déploiement dépendant d'un service tiers momentané.
  schedule:
    - cron: '13 5 * * 1'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  verify:
    # Le run planifié ne lance pas la suite applicative complète : son unique objet
    # est le contrôle de disponibilité ci-dessous.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Refus anonymes/authentifiés et autorisations des deux comptes, exercés contre les
      # vrais moteurs de règles. Le projet `demo-*` interdit tout repli accidentel en production.
      - run: pnpm run test:firebase-rules

      - run: pnpm exec playwright install --with-deps chromium

      # Ordre du moins coûteux au plus coûteux. La cohérence statique des import
      # maps est bloquante, et les trois gestes auparavant diagnostiques le sont
      # désormais après leur stabilisation.
      - run: pnpm run verify
        env:
          RPG_FIREBASE_CONFIG: ${{ secrets.RPG_FIREBASE_CONFIG }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  dependency-availability:
    # Service séparé : il contrôle les réponses CDN et signale les versions npm
    # récentes, mais une indisponibilité extérieure ne bloque jamais un push.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/check-deps.mjs --availability

  build:
    needs: verify
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      # Le numéro de build est le compte réel des commits : un clone superficiel
      # le remplacerait silencieusement par 1.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Estamper la version
        run: |
          RPG_BUILD="$(git rev-list --count HEAD)" node scripts/stamp-version.mjs
          cat js/core/version.js

      - name: Construire le paquet Pages
        run: node scripts/build-site.mjs

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
